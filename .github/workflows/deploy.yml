name: Deploy su GitHub Pages

# Pubblica solo dopo che il workflow CI (test, lint, build, smoke, e2e) è
# finito con successo su un push a main, e pubblica esattamente quel commit.
# workflow_dispatch resta per ripubblicare a mano.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La base (/<nome del repo>/) la ricava vite.config.js da GITHUB_REPOSITORY.
      - run: npm run build
      - name: Verifica la base della build
        run: grep -q 'src="/${{ github.event.repository.name }}/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
