name: CI

# Controlli su ogni PR verso main e su ogni push su main. Il deploy su Pages
# (deploy.yml) parte solo quando questo workflow finisce con successo su main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (gli warning non bloccano, gli errori sì)
        run: npm run lint
      - name: Test unitari
        run: npm test
      - name: Build
        run: npm run build
      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test (l'app parte senza errori JS)
        run: node test/smoke.mjs
      - name: Test end-to-end
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Report e2e in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
